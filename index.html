<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfólio</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- fonte do site: Geist Mono (monoespaçada; hierarquia por peso, tamanho e maiúsculas espaçadas) -->
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@100..900&display=swap" rel="stylesheet">
  <!-- fontes das letras do logo -->
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Bungee+Outline&family=Bungee+Shade&family=Codystar&family=Crimson+Text&family=DM+Serif+Display&family=Major+Mono+Display&family=Monoton&family=Pinyon+Script&family=Rampart+One&family=Rubik+Mono+One&family=Silkscreen&family=Special+Elite&family=Syne+Mono&family=UnifrakturMaguntia&family=VT323&display=block" rel="stylesheet">
  <!-- símbolos do logo (aparecem iguais em qualquer aparelho) -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans&family=Noto+Sans+Math&family=Noto+Sans+Symbols&family=Noto+Sans+Symbols+2&display=block" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <!-- Three.js: a biblioteca que desenha o 3D no navegador -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>

  <!-- Aqui o 3D é desenhado (personagem, chão, bolhas) -->
  <canvas id="cena"></canvas>

  <!-- tela de carregamento (pixels que somem aos poucos) — ver carregamento.js -->
  <canvas id="carregando"></canvas>
  <div id="aviso" hidden></div>

  <!-- TOPO: logo modular (a cabeça + letras que trocam ao passar o mouse) -->
  <header class="topo">
    <!-- as versões das letras ficam no logo.js -->
    <a class="logo" id="logo" href="#" aria-label="Persocom">
      <div class="logo-cabeca">
        <img class="cabeca-base" src="logo/asset-11.svg" alt="">
        <div class="cabeca-variante"></div>
        <svg class="cabeca-rosto" viewBox="0 0 203 223" aria-hidden="true"></svg>
      </div>
    </a>
  </header>

  <!-- CUSTOMIZE PERSOCOM: nuvenzinha de pensamento saindo dela, ao lado da cabeça (o pintura.js põe o lápis da Ana
       dentro, posiciona e abre o modo pintura) -->
  <button class="nuvem-balao" type="button" aria-label="customize persocom" hidden><span>customize persocom</span></button>

  <!-- SOBRE MIM: o botão redondo embaixo dela (o sobre.js encaixa acima dos projetos e abre a fala com o holofote).
       Ícone = desenho da Ana (icones/customizar.svg): a bonequinha com "?" no peito.
       Contato/Instagram/currículo ficam no fim da conversa e no fim dos projetos (<footer class="projetos-fim">) -->
  <button class="bola botao-sobre" type="button" data-dica="sobre mim" aria-label="sobre mim" hidden>
    <svg viewBox="0 0 224.05 404.38" aria-hidden="true">
  <path fill="currentColor" d="M201.93,134.11c5.92-2.2,11.84-2.32,16.97,1.77,7.91,6.31,5.02,14.26,2.36,22.5-2.42,7.48-6.2,16-12.44,21.08-4.76,3.87-12.29,5.25-18.29,5.57-4.42,14.47-13.7,26.94-25.7,36.01-12.65,9.56-32.49,20.4-47.7,24.86-5.66,1.66-7.84.82-13.1-1.06-20.1-7.17-47.25-21.58-60-38.99-4.41-6.03-8.09-13.79-10.53-20.82-11.81-.42-19.5-4.38-25.51-14.52C4.8,165.16-.43,150.99.03,144.97c.78-10.2,13.46-15.06,22.07-10.85-1.48-16.18-5.61-32.31-3.89-48.65.9-8.52,3.59-20.28,6.24-28.46C33.5,29.12,57.89,10.42,85.99,4.17,92.29,2.77,105.76.06,111.82,0s20.54,2.81,26.63,4.16c27.71,6.15,52.69,25.54,61.23,53.14,4.67,15.1,7.62,31.18,6.19,47.04l-3.94,29.78Z"/>
  <path fill="#fff" d="M131.94,196.02c0,2.12-8.92,3.83-19.92,3.83s-19.92-1.71-19.92-3.83l5.49.34c9.58.6,19.29.6,28.87,0l5.49-.34Z"/>
  <ellipse fill="#fff" cx="68.02" cy="145.05" rx="6.67" ry="24.67"/>
  <ellipse fill="#fff" cx="156.02" cy="145.05" rx="6.67" ry="24.67"/>
  <path fill="currentColor" d="M113.47,228.38h0c31.28,0,56.67,25.39,56.67,56.67v119.33H56.8v-119.33c0-31.28,25.39-56.67,56.67-56.67Z"/>
  <path fill="#fff" d="M95.45,291.69l-7.23-7.5c2.45-3.46,5.93-6.24,10.46-8.34,4.53-2.1,9.43-3.15,14.71-3.15l-.1,9.96c-3.29,0-6.52.82-9.7,2.46-3.18,1.64-5.89,3.83-8.13,6.55ZM111.6,349.25c-2.13,0-3.96-.76-5.48-2.28-1.52-1.52-2.28-3.35-2.28-5.48s.76-4,2.28-5.5c1.52-1.5,3.35-2.25,5.48-2.25s4,.75,5.5,2.25c1.5,1.5,2.25,3.34,2.25,5.5s-.75,3.96-2.25,5.48c-1.5,1.52-3.34,2.28-5.5,2.28ZM106.25,324.3v-5.03c0-3.46.72-6.51,2.15-9.15,1.43-2.64,3.58-4.87,6.45-6.68,2.83-1.75,4.95-3.66,6.37-5.74,1.42-2.08,2.12-4.33,2.12-6.74,0-2.62-.87-4.66-2.62-6.11-1.75-1.45-4.23-2.18-7.44-2.18l.1-9.96c6.81,0,12.1,1.55,15.86,4.64,3.76,3.09,5.64,7.45,5.64,13.08,0,3.88-.97,7.41-2.91,10.59-1.94,3.18-4.85,6.01-8.73,8.49-2.24,1.47-3.92,3.07-5.03,4.8-1.12,1.73-1.68,3.63-1.68,5.69v4.3h-10.28Z"/>
</svg>
  </button>

  <!-- véu branco que deixa a cena enevoada conforme a pessoa desce pros projetos -->
  <div class="veu" id="veu" aria-hidden="true"></div>

  <!-- a página rola: primeiro a home (ela, só o espaço vazio por cima da cena), depois os PROJETOS todos juntos.
       O conteúdo fica no projetos.js (listas CATEGORIAS, DESENHOS e PROJETOS) -->
  <main class="pagina">
    <div class="home-espaco" aria-hidden="true"></div>
    <section class="projetos" id="projetos" aria-label="Projetos">
      <header class="projetos-topo">
        <h2 class="projetos-titulo">
          <button class="seta-descer" type="button" data-descer aria-label="descer pros projetos">⌄</button>projetos
        </h2>
      </header>
      <div class="grade" id="grade"></div>
      <footer class="projetos-fim">
        <!-- TROQUE OS LINKS AQUI (e-mail: href="mailto:seu@email.com" · Instagram: href="https://instagram.com/seu.arroba"
             · currículo: href="curriculo.pdf"); a Persocom mostra estes mesmos no fim da fala dela -->
        <nav class="contatos" aria-label="contato">
          <a class="pilula" href="#" data-contato>✉ contato</a>
          <a class="pilula" href="#" data-contato target="_blank" rel="noopener">◎ instagram</a>
          <a class="pilula" href="#" data-contato target="_blank" rel="noopener">☰ currículo</a>
        </nav>
        <button class="pilula" type="button" data-subir>⌃ voltar pro começo</button>
      </footer>
    </section>
  </main>

  <!-- a página de cada projeto abre num painel por cima de tudo -->
  <section class="galeria" id="galeria" aria-live="polite" aria-hidden="true"></section>

  <script type="module" src="projetos.js"></script>
  <script type="module" src="main.js"></script>
  <script type="module" src="logo.js"></script>
  <script type="module" src="cursor.js"></script>
</body>
</html>
